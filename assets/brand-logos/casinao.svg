<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
<title id="title">Casinao.cz</title>
<desc id="desc">Černozlatý kruhový znak Casinao s písmeny CZ a názvem Casinao.</desc>
<defs>
 <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff1a3"/><stop offset=".35" stop-color="#e5ae2d"/><stop offset=".7" stop-color="#ffc941"/><stop offset="1" stop-color="#94620a"/></linearGradient>
 <linearGradient id="goldSoft" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffe67b"/><stop offset=".5" stop-color="#c98d18"/><stop offset="1" stop-color="#ffe174"/></linearGradient>
 <radialGradient id="disk" cx=".5" cy=".45" r=".7"><stop stop-color="#151728"/><stop offset=".82" stop-color="#070912"/><stop offset="1" stop-color="#02030a"/></radialGradient>
 <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="10" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<circle cx="256" cy="256" r="224" fill="#05060a" opacity=".75" filter="url(#glow)"/>
<circle cx="256" cy="256" r="207" fill="url(#disk)" stroke="url(#gold)" stroke-width="16"/>
<circle cx="256" cy="256" r="184" fill="none" stroke="#60430d" stroke-width="8"/>
<circle cx="256" cy="256" r="172" fill="none" stroke="url(#goldSoft)" stroke-width="5" opacity=".9"/>
<circle cx="256" cy="256" r="137" fill="none" stroke="url(#gold)" stroke-width="6" stroke-dasharray="360 80" transform="rotate(-32 256 256)"/>
<circle cx="256" cy="256" r="102" fill="none" stroke="#f4d263" stroke-width="4" stroke-dasharray="190 60" transform="rotate(202 256 256)"/>
