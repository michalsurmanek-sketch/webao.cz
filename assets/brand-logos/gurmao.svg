<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" role="img" aria-labelledby="title desc">
  <title id="title">GURMAO</title>
  <desc id="desc">Původní typografické logo GURMAO s písmenem M ve zlatém medailonu.</desc>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4d566"/>
      <stop offset=".56" stop-color="#d4af37"/>
      <stop offset="1" stop-color="#a87913"/>
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000" flood-opacity=".28"/>
    </filter>
  </defs>
  <text x="0" y="48" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="800" letter-spacing="2.5" textLength="105" lengthAdjust="spacingAndGlyphs">GUR</text>
  <circle cx="130" cy="32" r="21.5" fill="url(#gold)" stroke="#ffe891" stroke-opacity=".72" stroke-width="1" filter="url(#soft-shadow)"/>
  <text x="130" y="43.5" text-anchor="middle" fill="#0b0b0d" font-family="Inter, Arial, sans-serif" font-size="29" font-weight="800">M</text>
  <text x="158" y="48" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="800" letter-spacing="2.5" textLength="110" lengthAdjust="spacingAndGlyphs">AO</text>
</svg>