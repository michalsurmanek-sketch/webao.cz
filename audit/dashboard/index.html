<!doctype html>
<html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Moje weby | WEBAO Audit</title><meta name="robots" content="noindex"><style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fa;color:#17251f;font:16px system-ui,sans-serif}header{background:white;border-bottom:1px solid #ddd;padding:18px 5%}a{color:#176b43}main{max-width:1000px;margin:auto;padding:24px 16px}h1{font-size:30px}section{background:white;border:1px solid #dce4df;border-radius:16px;padding:20px;margin:16px 0}button,input{font:inherit;padding:12px;border:1px solid #b8c9bf;border-radius:9px}button{background:#176b43;color:white;cursor:pointer}button:disabled{opacity:.5;cursor:default}form{display:flex;gap:8px;flex-wrap:wrap}input{flex:1;min-width:180px}.muted{color:#58665f}.project{padding:14px 0;border-bottom:1px solid #e4e9e6;overflow-wrap:anywhere}.project button{margin:8px 8px 0 0}pre{white-space:pre-wrap;overflow-wrap:anywhere}svg{width:100%;height:auto}#status{padding:12px;background:#eef3ef;border-radius:8px}button.secondary{background:white;color:#176b43}
</style></head><body><header><strong>WEBAO Audit</strong> · <a href="../">Veřejný audit</a></header><main><h1>Moje weby</h1><p class="muted">Spravujte projekty a sledujte vývoj jejich výsledků.</p><p id="status" role="status">Přihlašování zatím není aktivní.</p><div id="signin"></div><section><h2>Nový projekt</h2><form id="add"><input name="url" type="url" placeholder="https://vas-web.cz" required disabled><input name="name" placeholder="Název projektu" maxlength="200" disabled><button disabled>Přidat web</button></form></section><section><h2>Vaše projekty</h2><div id="projects" class="muted">Po přihlášení se zobrazí vaše weby.</div></section><section id="history" hidden><h2>Historie auditů</h2><div id="chart"></div><div id="audits"></div><pre id="report" hidden></pre></section></main><script type="module">
const API='https://webao-audit-api.michalsurmanek.workers.dev';
let token='',active=null;const $=id=>document.getElementById(id);const status=t=>$('status').textContent=t;
async function api(path,options={}){const r=await fetch(API+path,{...options,headers:{Authorization:'Bearer '+token,...(options.body?{'Content-Type':'application/json'}:{})}});if(!r.ok)throw Error('Požadavek selhal ('+r.status+')');return r.json()}
function el(tag,text){const n=document.createElement(tag);n.textContent=text;return n}
function btn(text,fn){const b=el('button',text);b.type='button';b.onclick=()=>Promise.resolve().then(fn).catch(e=>status(e.message));return b}
async function load(){const {projects}=await api('/api/projects');$('projects').replaceChildren();if(!projects.length)$('projects').append(el('p','Zatím nemáte žádný projekt.'));for(const p of projects){const row=el('div','');row.className='project';row.append(el('strong',p.name),el('p',p.url),btn('Historie',()=>history(p.id)),btn('Odstranit',async()=>{if(!confirm('Odstranit projekt včetně auditů?'))return;await api('/api/projects/'+p.id,{method:'DELETE'});$('history').hidden=true;await load()}));$('projects').append(row)}}
async function history(id){active=id;const {audits}=await api('/api/projects/'+id+'/audits');if(active!==id)return;$('history').hidden=false;$('report').hidden=true;$('audits').replaceChildren();$('chart').replaceChildren();const points=audits.filter(a=>Number.isFinite(a.score)).reverse();if(points.length){const ns='http://www.w3.org/2000/svg',svg=document.createElementNS(ns,'svg');svg.setAttribute('viewBox','0 0 600 180');svg.setAttribute('role','img');svg.setAttribute('aria-label','Vývoj skóre od 0 do 100');const line=document.createElementNS(ns,'polyline');line.setAttribute('points',points.map((a,i)=>(20+560*i/Math.max(1,points.length-1))+','+(160-1.4*a.score)).join(' '));line.setAttribute('fill','none');line.setAttribute('stroke','#176b43');line.setAttribute('stroke-width','3');svg.append(line);for(let i=0;i<points.length;i++){const c=document.createElementNS(ns,'circle');c.setAttribute('cx',20+560*i/Math.max(1,points.length-1));c.setAttribute('cy',160-1.4*points[i].score);c.setAttribute('r','4');c.setAttribute('fill','#176b43');svg.append(c)}$('chart').append(svg)}if(!audits.length)$('audits').append(el('p','Zatím žádné uložené audity.'));for(const a of audits){const row=el('div',new Date(a.created_at*1000).toLocaleString('cs-CZ')+' · '+(a.score??'—')+'/100');row.append(btn('Report',async()=>{const {audit}=await api('/api/projects/'+id+'/audits/'+a.id);if(active!==id)return;$('report').textContent=JSON.stringify(audit.report,null,2);$('report').hidden=false}));$('audits').append(row)}}
$('add').onsubmit=async e=>{e.preventDefault();const data=new FormData(e.target);try{await api('/api/projects',{method:'POST',body:JSON.stringify({url:data.get('url'),name:data.get('name')||undefined})});e.target.reset();await load()}catch(e){status(e.message)}};
</script></body></html>
