name: Refresh desktop project previews
on:
  push:
    paths:
      - '.github/workflows/refresh-project-previews.yml'
  workflow_dispatch:
  schedule:
    - cron: '15 5 * * 1'
permissions:
  contents: write
jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm install --no-save playwright sharp
          npx playwright install --with-deps chromium
      - name: Capture desktop previews
        run: |
          node <<'JS'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const sharp = require('sharp');
          (async () => {
            const browser = await chromium.launch({headless:true});
            let successes = 0;
            for (const slug of ['opravao','vibrao']) {
              const page = await browser.newPage({viewport:{width:1440,height:990},deviceScaleFactor:1,isMobile:false});
              try {
                await page.goto('https://' + slug + '.cz/',{waitUntil:'domcontentloaded',timeout:45000});
                await page.waitForTimeout(4000);
                const image = await page.screenshot({type:'jpeg',quality:85});
                await sharp(image).resize(1100,756,{fit:'cover',position:'north'}).webp({quality:85}).toFile('assets/previews/'+slug+'.webp');
                console.log('Captured '+slug);
                successes++;
              } catch (e) {
                console.error('Screenshot failed for '+slug+': '+e.message);
              } finally { await page.close(); }
            }
            await browser.close();
            if (!successes) process.exitCode=1;
          })().catch(e=>{console.error(e);process.exitCode=1});
          JS
      - name: Commit updated previews
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/previews/opravao.webp assets/previews/vibrao.webp
          if ! git diff --cached --quiet; then
            git commit -m "Refresh desktop previews for Opravao and Vibrao"
            git push
          fi
